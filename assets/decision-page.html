<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TraceCart</title>
  <link rel="stylesheet" href="/assets/decision-flow.css">
  <link rel="stylesheet" href="/assets/live-workspace.css">
  <script defer src="/assets/offer-graph.js"></script>
  <script defer src="/assets/live-workspace.js"></script>
</head>
<body class="live-page">
  <main id="decision-app" class="live-workspace"
        data-source="{{DECISION_URL}}"
        data-live="{{LIVE_URL}}"
        data-knowledge-graph="{{KNOWLEDGE_GRAPH_URL}}"
        data-audit="{{AUDIT_URL}}"
        data-product-url="{{PRODUCT_URL}}">
    <header class="live-header">
      <a class="live-brand" href="/cart">tracecart</a>
      <form id="product-form" class="live-url-form" action="/cart/add" method="post">
        <input type="hidden" name="csrf" value="{{CSRF}}">
        <label for="product_url" class="sr-only">Product URL</label>
        <input id="product_url" name="product_url" type="url" maxlength="1200"
          placeholder="Paste a product URL" autocomplete="url"
          value="{{PRODUCT_URL}}" required>
        <button type="submit" id="analyze-button"><span class="analyze-spin"
          aria-hidden="true"></span><span id="analyze-label">Analyze</span></button>
      </form>
      <span class="live-status" id="job-state" role="status" aria-live="polite">Ready</span>
    </header>
    <div class="live-grid">
      <aside class="live-sidebar live-left" aria-label="Source research jobs">
        <div class="live-sidebar-head">
          <span>Sources</span><span id="live-source-count">0</span>
        </div>
        <div class="live-task-list" id="live-source-tasks" aria-live="polite">
          <p class="live-empty">Waiting for a product URL.</p>
        </div>
      </aside>
      <section class="live-stage" aria-label="Growing evidence graph">
        <section id="live-verdict" class="live-verdict" hidden
          aria-label="Final research verdict" aria-live="polite"></section>
        <section id="link-safety" class="link-safety" hidden
          aria-label="Retailer link safety checks" aria-live="polite"></section>
        <section id="knowledge-graph-region" class="knowledge-graph-region"
          aria-label="Connected product and evidence graph">
          <div class="live-graph-top">
            <span id="live-graph-count">0 nodes · 0 links</span>
            <div class="kg-toolbar" aria-label="Graph controls">
              <button type="button" id="kg-all" aria-pressed="false">All</button>
              <button type="button" id="kg-input" aria-pressed="true">Input</button>
              <button type="button" id="kg-zoom-in" aria-label="Zoom in">+</button>
              <button type="button" id="kg-zoom-out" aria-label="Zoom out">−</button>
              <button type="button" id="kg-reset">Reset</button>
            </div>
          </div>
          <div id="kg-stats" class="kg-stats" aria-live="polite"></div>
          <div class="kg-layout">
            <div class="kg-viewport">
              <svg id="kg-svg" viewBox="0 0 1120 880" role="img"
                   aria-label="Growing evidence network; select nodes to inspect supporting data"></svg>
            </div>
            <aside id="kg-details" class="kg-details" aria-label="Selected graph node details"></aside>
          </div>
        </section>
        <div class="live-footer">
          <span id="live-evidence-status">Unverified claims are not evidence.</span>
          <nav>
            <a id="graph-export" href="{{KNOWLEDGE_GRAPH_URL}}" target="_blank" rel="noopener noreferrer">Graph JSON</a>
            <a id="audit-link" href="{{AUDIT_URL}}" target="_blank" rel="noopener noreferrer">Audit</a>
          </nav>
        </div>
      </section>
      <aside class="live-sidebar live-right" aria-label="Research questions and verification tasks">
        <div class="live-sidebar-head">
          <span>Evidence gaps</span><span id="live-question-count">0</span>
        </div>
        <div class="live-task-list" id="live-question-tasks" aria-live="polite">
          <p class="live-empty">Questions appear as sources are discovered.</p>
        </div>
      </aside>
    </div>
  </main>
  <noscript><p>JavaScript is needed for live graph updates. <a href="{{AUDIT_URL}}">View the saved research audit.</a></p></noscript>
</body>
</html>
